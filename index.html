<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Hogwarts Witch or Wizard Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight-deep:#0a0b1a;
    --midnight:#14172e;
    --plum:#2e2044;
    --plum-light:#3c2c56;
    --gold:#c9a24b;
    --gold-soft:#e8cd8a;
    --ember:#e0703a;
    --parchment:#ede7f6;
    --muted:#9c93b8;
    --line:rgba(201,162,75,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(62,44,86,0.55), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(224,112,58,0.10), transparent 45%),
      linear-gradient(180deg, var(--midnight-deep), var(--midnight) 60%, var(--midnight-deep));
    color:var(--parchment);
    font-family:'Cormorant Garamond', serif;
    position:relative;
    overflow-x:hidden;
    transition:background 1.1s ease;
  }
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .stars span{
    position:absolute; width:2px;height:2px;border-radius:50%;
    background:var(--gold-soft); opacity:.55;
    animation:twinkle 4.5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.85;}}
  @media (prefers-reduced-motion: reduce){
    .stars span{animation:none;opacity:.35;}
    *{animation-duration:.001s !important; transition-duration:.15s !important;}
  }

  .eyebrow{
    font-family:'Cinzel', serif; font-weight:600; letter-spacing:.28em;
    text-transform:uppercase; font-size:.72rem; color:var(--gold);
    display:inline-block; margin-bottom:.9rem;
  }
  h1,h2,h3{font-family:'Cinzel', serif; font-weight:600; margin:0; color:var(--gold-soft);}

  #app{position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:5vh 1.25rem;}
  .view{display:none; width:100%; max-width:640px; margin:0 auto; animation:fadeUp .7s ease both;}
  .view.active{display:block;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- START VIEW ---------- */
  #view-start{text-align:center;}
  #view-start.active{display:flex; flex-direction:column; align-items:center;}
  .sorting-hat-mark{display:block; width:64px;height:64px;margin:0 0 1.5rem;opacity:.9;}
  #view-start h1{font-size:clamp(2rem, 5vw, 2.9rem); line-height:1.15; margin-bottom:1rem;}
  #view-start p.lede{color:var(--muted); font-size:1.2rem; font-style:italic; margin:0 auto 2.2rem; max-width:460px;}
  .btn{
    font-family:'Cinzel', serif; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; font-size:.85rem; color:var(--midnight-deep);
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    border:none; padding:.95rem 2.1rem; border-radius:2px; cursor:pointer;
    box-shadow:0 0 0 1px rgba(201,162,75,.4), 0 8px 24px rgba(201,162,75,.18);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 0 0 1px rgba(201,162,75,.6), 0 12px 30px rgba(201,162,75,.3);}
  .btn:focus-visible{outline:2px solid var(--ember); outline-offset:3px;}
  .btn-ghost{
    background:transparent; color:var(--gold-soft);
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--gold); transform:translateY(-2px);}

  /* ---------- CONSTELLATION PROGRESS ---------- */
  .constellation{display:flex; justify-content:center; margin-bottom:2.2rem;}
  .constellation svg{overflow:visible;}
  .const-line{stroke:var(--line); stroke-width:1.5; fill:none;}
  .const-line.lit{stroke:var(--gold); transition:stroke 1s ease;}
  .const-dot{fill:var(--midnight); stroke:var(--muted); stroke-width:1.5; transition:all .5s ease;}
  .const-dot.lit{fill:var(--gold); stroke:var(--gold-soft); filter:drop-shadow(0 0 5px var(--gold));}

  /* ---------- QUIZ VIEW ---------- */
  .q-eyebrow{text-align:center; display:block; color:var(--muted); font-family:'Cinzel',serif; letter-spacing:.2em; font-size:.7rem; text-transform:uppercase; margin-bottom:.6rem;}
  .q-card{
    background:linear-gradient(180deg, rgba(46,32,68,0.55), rgba(20,23,46,0.55));
    border:1px solid var(--line); border-radius:6px; padding:2.4rem 2rem;
    backdrop-filter:blur(6px);
  }
  .q-text{font-size:clamp(1.35rem,3vw,1.65rem); text-align:center; line-height:1.4; margin-bottom:2rem; color:var(--parchment);}
  .answers{display:flex; flex-direction:column; gap:.7rem;}
  .answer{
    text-align:left; font-family:'Cormorant Garamond', serif; font-size:1.12rem;
    color:var(--parchment); background:rgba(237,231,246,0.03);
    border:1px solid var(--line); border-radius:4px; padding:.95rem 1.2rem;
    cursor:pointer; transition:all .25s ease; position:relative;
  }
  .answer:hover{border-color:var(--gold); background:rgba(201,162,75,.08); transform:translateX(4px);}
  .answer:focus-visible{outline:2px solid var(--ember); outline-offset:2px;}
  .answer .mark{color:var(--gold); font-family:'Cinzel',serif; margin-right:.6rem; font-size:.85rem;}

  /* ---------- RESULT VIEW ---------- */
  #view-result{text-align:center; max-width:560px;}
  .sigil-wrap{width:150px;height:150px;margin:0 auto 1rem; position:relative;}
  .sigil-svg{width:100%;height:100%;}
  .sigil-ring{fill:none; stroke:var(--result-accent, var(--gold)); stroke-width:1.6; opacity:.85;}
  .sigil-fill{fill:none; stroke:var(--result-accent, var(--gold)); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
  .sigil-fill.solid{fill:var(--result-accent, var(--gold)); stroke:none;}
  .result-eyebrow{color:var(--result-accent, var(--gold)); opacity:.9;}
  #result-name{font-size:clamp(2rem,5vw,2.6rem); margin-bottom:.15rem;}
  #result-title{font-style:italic; font-family:'Cormorant Garamond',serif; font-weight:500; color:var(--muted); font-size:1.15rem; margin-bottom:1.6rem;}
  #result-mbti{
    font-family:'Cinzel',serif; letter-spacing:.3em; font-size:.85rem; color:var(--result-accent, var(--gold));
    border:1px solid var(--line); display:inline-block; padding:.3rem .9rem; border-radius:2px; margin-bottom:1.6rem;
  }
  #result-desc{font-size:1.18rem; line-height:1.6; color:var(--parchment); margin-bottom:2rem;}
  .fortune{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:1.4rem 1rem; margin-bottom:2.2rem;
  }
  .fortune .eyebrow{color:var(--result-accent, var(--gold));}
  .fortune p{font-style:italic; font-size:1.25rem; margin:0; color:var(--gold-soft);}
  .result-actions{display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap;}

  #share-canvas{display:none;}
  footer.credit{
    position:relative; z-index:1; text-align:center; color:var(--muted);
    font-size:.75rem; letter-spacing:.05em; padding:0 1rem 2.5rem; opacity:.6;
  }
  @media (max-width:480px){
    .q-card{padding:1.7rem 1.2rem;}
    .result-actions{flex-direction:column; align-items:stretch;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="app">

  <!-- START -->
  <section class="view active" id="view-start">
    <svg class="sorting-hat-mark" viewBox="0 0 100 100" fill="none" stroke="var(--gold)" stroke-width="1.8">
      <circle cx="50" cy="50" r="38"/>
      <ellipse cx="50" cy="72" rx="26" ry="6"/>
      <path d="M38 66 L46 24 Q50 18 56 22 L64 66"/>
      <path d="M36 65 Q50 70 64 65"/>
      <path d="M52 34 L52 42 M48 38 L56 38"/>
    </svg>
    <span class="eyebrow">A Divination</span>
    <h1>Which Hogwarts Witch or&nbsp;Wizard&nbsp;Are&nbsp;You?</h1>
    <p class="lede">Eight questions. The stars, and your own instincts, will do the rest.</p>
    <button class="btn" id="btn-start">Begin the Reading</button>
  </section>

  <!-- QUIZ -->
  <section class="view" id="view-quiz">
    <div class="constellation">
      <svg id="const-svg" width="280" height="46" viewBox="0 0 280 46"></svg>
    </div>
    <span class="q-eyebrow" id="q-counter">Question 1 of 8</span>
    <div class="q-card">
      <p class="q-text" id="q-text"></p>
      <div class="answers" id="q-answers"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="view" id="view-result">
    <div class="sigil-wrap" id="sigil-wrap"></div>
    <span class="eyebrow result-eyebrow">You are most like</span>
    <h1 id="result-name"></h1>
    <p id="result-title"></p>
    <span id="result-mbti"></span>
    <p id="result-desc"></p>
    <div class="fortune">
      <span class="eyebrow">Your fortune for today</span>
      <p id="result-fortune"></p>
    </div>
    <div class="result-actions">
      <button class="btn" id="btn-retry">Consult the Stars Again</button>
      <button class="btn btn-ghost" id="btn-save">Save Your Fortune</button>
    </div>
  </section>

</div>

<canvas id="share-canvas" width="1000" height="1250"></canvas>

<footer class="credit">A very unofficial Sorting &middot; not affiliated with J.K. Rowling or Warner Bros.</footer>

<script>
/* =========================================================
   BACKGROUND STARFIELD
========================================================= */
(function(){
  const box = document.getElementById('stars');
  const n = 60;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*4.5)+'s';
    s.style.width = s.style.height = (Math.random()<0.15 ? '3px':'1.5px');
    box.appendChild(s);
  }
})();

/* =========================================================
   STATE + FLOW
========================================================= */
let selectedQuestions = [];
let answerLog = []; // {axis, letter, order}
let currentIndex = 0;
let answerCounter = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuiz(){
  selectedQuestions = [];
  Object.keys(POOLS).forEach(axis=>{
    const picks = shuffle(POOLS[axis]).slice(0,2);
    picks.forEach(q=> selectedQuestions.push({axis, question:q}));
  });
  selectedQuestions = shuffle(selectedQuestions);
  answerLog = [];
  currentIndex = 0;
  answerCounter = 0;
}

function switchView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---- constellation progress ---- */
function buildConstellation(){
  const svg = document.getElementById('const-svg');
  svg.innerHTML = '';
  const n = 8, w = 280, cy = 23;
  const positions = [];
  for(let i=0;i<n;i++){
    positions.push({x: 14 + i*((w-28)/(n-1)), y: cy + (i%2===0? -8:8)});
  }
  for(let i=0;i<n-1;i++){
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',positions[i].x); line.setAttribute('y1',positions[i].y);
    line.setAttribute('x2',positions[i+1].x); line.setAttribute('y2',positions[i+1].y);
    line.setAttribute('class','const-line');
    line.setAttribute('id','line-'+i);
    svg.appendChild(line);
  }
  positions.forEach((p,i)=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',5);
    c.setAttribute('class','const-dot'); c.setAttribute('id','dot-'+i);
    svg.appendChild(c);
  });
}
function litConstellation(count){
  for(let i=0;i<8;i++){
    const dot = document.getElementById('dot-'+i);
    if(dot) dot.classList.toggle('lit', i < count);
  }
  for(let i=0;i<7;i++){
    const line = document.getElementById('line-'+i);
    if(line) line.classList.toggle('lit', i < count-1);
  }
}

/* ---- render question ---- */
function renderQuestion(){
  const item = selectedQuestions[currentIndex];
  document.getElementById('q-counter').textContent = `Question ${currentIndex+1} of ${selectedQuestions.length}`;
  document.getElementById('q-text').textContent = item.question.text;
  const wrap = document.getElementById('q-answers');
  wrap.innerHTML = '';
  const marks = ['I','II','III','IV'];
  shuffle(item.question.answers).forEach((ans, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.innerHTML = `<span class="mark">${marks[idx]}.</span>${ans.text}`;
    btn.addEventListener('click', ()=> handleAnswer(item.axis, ans.t));
    wrap.appendChild(btn);
  });
  litConstellation(answerCounter);
}

function handleAnswer(axis, letter){
  answerCounter++;
  answerLog.push({axis, letter, order:answerCounter});
  litConstellation(answerCounter);
  currentIndex++;
  if(currentIndex < selectedQuestions.length){
    setTimeout(renderQuestion, 180);
  } else {
    setTimeout(finishQuiz, 400);
  }
}

function computeType(){
  const axes = ['EI','SN','TF','JP'];
  let type = '';
  axes.forEach(axis=>{
    const letters = axis.split('');
    const votes = answerLog.filter(a=>a.axis===axis);
    let countA = votes.filter(v=>v.letter===letters[0]).length;
    let countB = votes.filter(v=>v.letter===letters[1]).length;
    if(countA > countB) type += letters[0];
    else if(countB > countA) type += letters[1];
    else {
      // tie-break: most recent answer on this axis wins
      const last = votes.reduce((a,b)=> a.order>b.order? a:b);
      type += last.letter;
    }
  });
  return type;
}

function finishQuiz(){
  const type = computeType();
  showResult(type);
}

function showResult(type){
  const c = CHARACTERS[type];
  document.body.style.background =
    `radial-gradient(ellipse at 15% -10%, ${c.colors[2]}33, transparent 55%),`+
    `radial-gradient(ellipse at 90% 105%, ${c.colors[2]}22, transparent 45%),`+
    `linear-gradient(180deg, ${c.colors[0]}, ${c.colors[1]} 55%, ${c.colors[0]})`;
  document.documentElement.style.setProperty('--result-accent', c.accent);

  document.getElementById('sigil-wrap').innerHTML = c.sigil;
  document.getElementById('result-name').textContent = c.name;
  document.getElementById('result-title').textContent = c.title;
  document.getElementById('result-mbti').textContent = type;
  document.getElementById('result-desc').textContent = c.desc;
  document.getElementById('result-fortune').textContent =
    c.fortunes[Math.floor(Math.random()*c.fortunes.length)];

  switchView('view-result');
  window.__lastType = type;
}

/* ---- share card ---- */
function drawShareCard(){
  const type = window.__lastType;
  if(!type) return;
  const c = CHARACTERS[type];
  const canvas = document.getElementById('share-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, c.colors[0]);
  grad.addColorStop(0.55, c.colors[1]);
  grad.addColorStop(1, c.colors[0]);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // subtle stars
  ctx.fillStyle = 'rgba(232,205,138,0.5)';
  for(let i=0;i<70;i++){
    const x = Math.random()*W, y = Math.random()*H*0.9;
    const r = Math.random()<0.15 ? 2.4:1.2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }

  // sigil ring
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(W/2, 300, 130, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = c.accent;
  ctx.font = '600 60px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(type, W/2, 320);

  ctx.fillStyle = '#ede7f6';
  ctx.font = '600 56px Georgia';
  ctx.fillText(c.name, W/2, 510);

  ctx.fillStyle = c.accent;
  ctx.font = 'italic 34px Georgia';
  ctx.fillText(c.title, W/2, 565);

  ctx.strokeStyle = 'rgba(201,162,75,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(120,650); ctx.lineTo(W-120,650); ctx.stroke();

  ctx.fillStyle = '#e8cd8a';
  ctx.font = 'italic 32px Georgia';
  wrapText(ctx, document.getElementById('result-fortune').textContent, W/2, 740, 760, 44);

  ctx.strokeStyle = 'rgba(201,162,75,0.4)';
  ctx.beginPath(); ctx.moveTo(120,900); ctx.lineTo(W-120,900); ctx.stroke();

  ctx.fillStyle = 'rgba(237,231,246,0.55)';
  ctx.font = '26px Georgia';
  ctx.fillText('Which Hogwarts Witch or Wizard Are You?', W/2, 960);

  const link = document.createElement('a');
  link.download = `${c.name.replace(/[^a-z0-9]+/gi,'-')}-fortune.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(word=>{
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      lines.push(line); line = word + ' ';
    } else { line = test; }
  });
  lines.push(line);
  const startY = y - ((lines.length-1)*lineHeight)/2;
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, startY + i*lineHeight));
}

/* ---- wire up ---- */
document.getElementById('btn-start').addEventListener('click', ()=>{
  buildQuiz();
  buildConstellation();
  switchView('view-quiz');
  renderQuestion();
});
document.getElementById('btn-retry').addEventListener('click', ()=>{
  document.body.style.background = '';
  document.documentElement.style.removeProperty('--result-accent');
  buildQuiz();
  buildConstellation();
  switchView('view-quiz');
  renderQuestion();
});
document.getElementById('btn-save').addEventListener('click', drawShareCard);
</script>
